name: Calibnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      # The backup test checks Claude Code itself can resume a restored session.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.312

      - name: Build and calibnet tests
        run: pnpm test:calibnet
        env:
          ATTIC_CALIBNET_PRIVATE_KEY: ${{ secrets.ATTIC_CALIBNET_PRIVATE_KEY }}
