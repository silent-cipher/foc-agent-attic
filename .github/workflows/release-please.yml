name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the release branch push with --dry-run (manual dispatch only)
        type: boolean
        default: false

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # release-please tags every merged, untagged release PR it finds, not only this push's.
  # So releases are created only on the push that merged the release PR, once CI and
  # the calibnet suite pass on that commit; other pushes only update the release PR.
  release-merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - name: Check whether this push merged the release PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MERGED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'any(.[]; any(.labels[]; .name == "autorelease: pending"))')"
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

  ci:
    needs: release-merge
    if: needs.release-merge.outputs.merged == 'true'
    uses: ./.github/workflows/ci.yml

  calibnet:
    needs: release-merge
    if: needs.release-merge.outputs.merged == 'true'
    uses: ./.github/workflows/calibnet.yml
    secrets: inherit

  release-please:
    needs: [release-merge, ci, calibnet]
    # ci and calibnet are skipped unless this push merged the release PR.
    if: |
      !cancelled() && needs.release-merge.result == 'success' && (
        needs.release-merge.outputs.merged != 'true' ||
        (needs.ci.result == 'success' && needs.calibnet.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PAT so release PRs trigger CI; GITHUB_TOKEN suppresses follow-on workflow runs.
          # It needs the permissions in https://github.com/googleapis/release-please-action?tab=readme-ov-file#workflow-permissions.
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          skip-github-release: ${{ needs.release-merge.outputs.merged != 'true' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Put the install notes above the changelog
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/changelog.md"
          cat .github/release-notes.md "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  validate-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate dispatch ref and release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          case "$REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Dispatch ref must be a vX.Y.Z tag, got: $REF"
              exit 1
              ;;
          esac
          TAG="${REF#refs/tags/}"
          VERSION="${TAG#v}"

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

          # Confirm the tag commit is on the default branch via GitHub's
          # compare API (works regardless of local clone depth).
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$SHA" --jq .status)"
          case "$STATUS" in
            identical|behind) ;;
            *)
              echo "::error::Tag commit $SHA is not an ancestor of $DEFAULT_BRANCH (compare status: $STATUS)"
              exit 1
              ;;
          esac

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG not found"
            exit 1
          fi

          # Installed plugins update only when the version changes, so never republish
          # the release branch's version or move it back to an older one.
          PUBLISHED=""
          if gh api "repos/$GITHUB_REPOSITORY/branches/release" >/dev/null 2>&1; then
            PUBLISHED="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/package.json?ref=release" | jq -r .version)"
          fi
          NEWEST="$(printf '%s\n%s\n' "$PUBLISHED" "$VERSION" | sort -V | tail -n 1)"
          if [ "$PUBLISHED" = "$VERSION" ] || [ "$NEWEST" != "$VERSION" ]; then
            echo "::error::The release branch already has $PUBLISHED"
            exit 1
          fi

  build:
    needs: [release-please, validate-dispatch]
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        needs.validate-dispatch.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      - name: Build
        run: pnpm build

      # Run a copy outside the checkout, so a dependency left out of the bundle fails here.
      - name: Check the bundle runs on its own
        run: |
          set -euo pipefail
          cp plugins/attic/dist/attic.mjs "$RUNNER_TEMP/attic.mjs"
          BUNDLE_VERSION="$(cd "$RUNNER_TEMP" && node attic.mjs --version)"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$BUNDLE_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Bundle prints $BUNDLE_VERSION, package.json has $PKG_VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attic-bundle
          path: plugins/attic/dist/attic.mjs
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    # build needs both release-please and validate-dispatch, and exactly one of
    # those is skipped on every trigger (release-please on dispatch, validate-dispatch
    # on push). That skip propagates down the needs chain, so publish must override
    # with always() the same way build does, then gate on build actually succeeding.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attic-bundle
          path: plugins/attic/dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Runs before the release branch push, which dispatch refuses to repeat, so dispatching
      # on the tag after a failure here retries both. A version already on npm is skipped.
      - name: Publish the CLI to npm
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "$NAME@$VERSION is already on npm"
          elif [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run
          else
            npm publish
          fi

      # Marketplaces added with the release ref install from this branch. Each commit is
      # the released tree plus the bundle, with the previous release as a second parent
      # so the branch only fast-forwards.
      - name: Push the bundle to the release branch
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          git add --force plugins/attic/dist/attic.mjs
          PARENTS=(-p HEAD)
          if git rev-parse --quiet --verify origin/release >/dev/null; then
            PARENTS+=(-p origin/release)
          fi
          COMMIT="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$(git write-tree)" "${PARENTS[@]}" -m "chore: release v$VERSION")"

          if [ "$DRY_RUN" = "true" ]; then
            git push --dry-run origin "$COMMIT:refs/heads/release"
          else
            git push origin "$COMMIT:refs/heads/release"
          fi
